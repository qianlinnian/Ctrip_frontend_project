<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册 - 易宿酒店管理平台</title>
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="./pc-common.css">
</head>
<body class="login-page">

  <!-- 注册容器 -->
  <div class="login-container">

    <!-- 左侧品牌区域 -->
    <div class="login-brand">
      <div class="brand-content">
        <h1 class="brand-logo">易宿酒店</h1>
        <p class="brand-slogan">Hotel Management Platform</p>
        <div class="brand-decoration">
          <div class="decoration-circle"></div>
          <div class="decoration-circle"></div>
          <div class="decoration-circle"></div>
        </div>
      </div>
    </div>

    <!-- 右侧注册表单 -->
    <div class="login-form-wrapper">
      <div class="login-form-container">

        <!-- 表单标题 -->
        <div class="form-header">
          <h2 class="form-title">用户注册</h2>
          <p class="form-subtitle">选择角色完成注册</p>
        </div>

        <!-- 角色选择 -->
        <div class="role-selector">
          <div class="role-card" id="merchantRole" onclick="selectRole('merchant')">
            <div class="role-icon">🏪</div>
            <h3 class="role-title">商户</h3>
            <p class="role-desc">上传和管理酒店信息</p>
          </div>
          <div class="role-card" id="adminRole" onclick="selectRole('admin')">
            <div class="role-icon">👨‍💼</div>
            <h3 class="role-title">管理员</h3>
            <p class="role-desc">审核和发布酒店信息</p>
          </div>
        </div>

        <!-- 注册表单 -->
        <form class="login-form" id="registerForm">
          <input type="hidden" id="selectedRole" value="">

          <div class="form-group">
            <label class="form-label">用户名</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input
                type="text"
                class="form-input"
                placeholder="请输入用户名（4-16位字符）"
                id="username"
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">手机号</label>
            <div class="input-wrapper">
              <span class="input-icon">📱</span>
              <input
                type="tel"
                class="form-input"
                placeholder="请输入手机号"
                id="phone"
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">邮箱</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                class="form-input"
                placeholder="请输入邮箱地址"
                id="email"
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                class="form-input"
                placeholder="请输入密码（6-20位）"
                id="password"
              >
              <span class="input-suffix" onclick="togglePassword(this)">👁️</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">确认密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                class="form-input"
                placeholder="请再次输入密码"
                id="confirmPassword"
              >
            </div>
          </div>
 

          <button type="button" class="btn btn-primary btn-block" onclick="handleRegister()">
            注 册
          </button>

          <div class="form-footer">
            <span class="footer-text">已有账号？</span>
            <a href="login.html" class="link-primary">立即登录</a>
          </div>
        </form>

      </div>
    </div>

  </div>

  <script>
    let selectedRole = '';

    // 角色选择
    function selectRole(role) {
      const merchantCard = document.getElementById('merchantRole');
      const adminCard = document.getElementById('adminRole');

      merchantCard.classList.remove('active');
      adminCard.classList.remove('active');

      if (role === 'merchant') {
        merchantCard.classList.add('active');
        selectedRole = 'merchant';
      } else {
        adminCard.classList.add('active');
        selectedRole = 'admin';
      }

      document.getElementById('selectedRole').value = selectedRole;
    }

    // 密码显示/隐藏
    function togglePassword(icon) {
      const input = icon.previousElementSibling;
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '👁️‍🗨️';
      } else {
        input.type = 'password';
        icon.textContent = '👁️';
      }
    }

    // 注册处理
    function handleRegister() {
      const username = document.getElementById('username').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const agreeTerms = document.getElementById('agreeTerms').checked;

      // 验证角色
      if (!selectedRole) {
        alert('请选择注册角色（商户或管理员）');
        return;
      }

      // 验证用户名
      if (!username || username.length < 4 || username.length > 16) {
        alert('请输入4-16位字符的用户名');
        return;
      }

      // 验证手机号
      if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
        alert('请输入正确的手机号');
        return;
      }

      // 验证邮箱
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert('请输入正确的邮箱地址');
        return;
      }

      // 验证密码
      if (!password || password.length < 6 || password.length > 20) {
        alert('请输入6-20位密码');
        return;
      }

      // 验证确认密码
      if (password !== confirmPassword) {
        alert('两次输入的密码不一致');
        return;
      } 
      // 模拟注册成功
      const roleText = selectedRole === 'merchant' ? '商户' : '管理员';
      alert(`注册成功！\n\n角色: ${roleText}\n用户名: ${username}\n手机: ${phone}\n邮箱: ${email}\n\n即将跳转到登录页面...`);
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1000);
    }
  </script>

  <style>
    /* 角色选择卡片 */
    .role-selector {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
    }

    .role-card {
      flex: 1;
      padding: 24px;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-medium);
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--bg-light);
    }

    .role-card:hover {
      border-color: var(--primary-color);
      background: var(--bg-white);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(24, 144, 255, 0.15);
    }

    .role-card.active {
      border-color: var(--primary-color);
      background: rgba(24, 144, 255, 0.05);
      box-shadow: 0 4px 12px rgba(24, 144, 255, 0.2);
    }

    .role-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .role-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .role-card.active .role-title {
      color: var(--primary-color);
    }

    .role-desc {
      font-size: 13px;
      color: var(--text-tertiary);
    }
  </style>

</body>
</html>
